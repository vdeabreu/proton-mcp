# Apache reverse proxy for the remote Proton Mail MCP server.
# Replace mcp.example.com with your domain, then:
#   sudo cp proton-mcp.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http
#   sudo a2ensite proton-mcp && sudo systemctl reload apache2
#   sudo certbot --apache -d mcp.example.com
# certbot creates proton-mcp-le-ssl.conf from this file (including the
# <Location /mcp> block) and redirects HTTP to HTTPS.
<VirtualHost *:80>
        ServerName mcp.example.com

        ProxyPass / http://127.0.0.1:8766/
        ProxyPassReverse / http://127.0.0.1:8766/

        # Only Anthropic's outbound ranges may call /mcp, so a leaked token is
        # useless from anywhere else. OAuth endpoints (/authorize, /login, /token,
        # /register, /.well-known/...) stay open: your own browser uses them.
        # Keep this list in sync with "Outbound IP addresses" on
        # https://platform.claude.com/docs/en/api/ip-addresses (checked 2026-11).
        <Location /mcp>
                Require ip 160.79.104.0/21 153.61.208.0/20
        </Location>
</VirtualHost>
